<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Color Properties</title>
    <link rel="stylesheet" href="style2.css" />
  </head>
  <body>
    <h1>Lets learn about colors</h1>
    <p>Color can be represented in:</p>

    <ol>
      <li class="colorCode">Color Keywords</li>
      <li class="hexCode">Hex Color Code</li>
      <li class="rgb">RGB</li>
      <li class="rgba">RGA</li>
      <li class="hsl">HSL</li>
      <li class="hsla">HSLA</li>
    </ol>

    <p>BG Color can be represented in:</p>

    <ol>
      <li class="colorCode">Color Keywords</li>
      <li class="hexCode">Hex Color Code</li>
      <li class="rgb">RGB</li>
      <li class="rgba">RGA</li>
      <li class="hsl">HSL</li>
      <li class="hsla">HSLA</li>
    </ol>
  </body>
</html>
