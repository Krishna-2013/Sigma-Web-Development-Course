<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><h1>Exercise 1 - Pure HTML Media Player</h1></li>
        </ul>
      </nav>
    </header>

    <main>
      <div>
        <audio controls preload="auto">
          <source src="1.mp3" />
        </audio>
      </div>
      <div>
        <audio controls preload="auto">
          <source src="2.mp3" />
        </audio>
      </div>
      <div>
        <audio controls preload="auto">
          <source src="3.mp3" />
        </audio>
      </div>
      <div>
        <audio controls preload="auto">
          <source src="4.mp3" />
        </audio>
      </div>
      <div>
        <audio controls preload="auto">
          <source src="5.mp3" />
        </audio>
      </div>

      <div>
        <video controls preload="auto" height="400">
            <source src="1.mp4">
        </video>
      </div>
      <div>
        <video controls preload="auto" height="400">
            <source src="2.mp4">
        </video>
      </div>
      <div>
        <video controls preload="auto" height="400">
            <source src="3.mp4">
        </video>
      </div>
      <div>
        <video controls preload="auto" height="400">
            <source src="4.mp4">
        </video>
      </div>
      <div>
        <video controls preload="auto" height="400">
            <source src="5.mp4">
        </video>
      </div>
    </main>
  </body>
</html>
