<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Exercise 12 - Color the Boxes</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 23px;
        }
        
        .box {
          display: flex;
          justify-content: center;
          align-items: center;
        height: 45px;
        width: 45px;
        border: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
    </div>
    <script>
      console.log("Hello World!");

      let colorArr = [
        "red",
        "blue",
        "green",
        "yellow",
        "black",
        "gray",
        "brown",
        "orange",
        "pink",
        "purple",
      ];

      let boxes = document.querySelectorAll(".box");
      let i = 0;
      boxes.forEach((element) => {
        index = Math.floor(Math.random() * colorArr.length);
        boxes[i].style.backgroundColor = colorArr[index];
        colorArr.splice(index, 1);
        i++;
      });
    </script>
  </body>
</html>
