<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video, Audio & Media in HTML</title>
</head>

<body>
    <video controls width="900" loop poster="abc.png" preload="auto">
        <source src="1209.mp4" type="video/mp4">
    </video>

    <audio controls loop preload="auto">
        <source src="Long Distance Love.mp3" type="audio/mpeg">
    </audio>

    <svg height="100" width="100">
        <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
    </svg>

    <img src="img.svg" alt="img of svg" />

    <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=8Ocr9j93P47DRv1e&amp;start=793" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>

</html>
