<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 121px;
            width: 121px;
            background-color: red;
            border-radius: 70px;
            position: absolute;
            bottom: 0;
            left: 0; 
        }

        .container {
            position: relative;
            height: 80vh;
            width: 80vw;
            background-color: blue;
        }
        
        .animation {
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: aniY 1s ease-out infinite alternate, aniX 3s linear infinite;
        }

        @keyframes aniY {
            from {
                bottom: 0;
            }

            to {
                bottom: 100%;
            }
        }

        @keyframes aniX {
            from {
                left: 0;
            }

            to {
                left: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="box animation">
        </div>
    </div>
</body>

</html>
